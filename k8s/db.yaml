apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - name: POSTGRES_DB
              value: api-db
            - name: POSTGRES_USER
              value: api-user
            - name: POSTGRES_PASSWORD
              value: api-password
          ports:
            - containerPort: 5432
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
          healthcheck:
            test: ["CMD-SHELL", "pg_isready -U api-user -d api-db"]
            interval: 2s
            retries: 10
            start_period: 1s
            timeout: 10s
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: default
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: db
